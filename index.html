<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <link rel="apple-touch-icon" href="rupee-icon.svg">
    <link rel="icon" href="rupee-icon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loginScreen" class="overlay">
        <div class="login-card">
            <h2 id="loginTitle">Welcome Back</h2>
            <p class="subtitle" id="loginSubtitle">Enter your 4-digit PIN</p>
            <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="••••">
            <button onclick="handleLogin()">Unlock</button>
            <p id="loginError" class="error-text hidden">Incorrect PIN</p>
        </div>
    </div>

    <div class="container hidden" id="mainApp">
        
        <div class="nav-bar">
            <button class="nav-btn active" id="navHome" onclick="switchTab('home')">Dashboard</button>
            <button class="nav-btn" id="navHistory" onclick="switchTab('history')">Statements</button>
        </div>

        <div id="tabHome">
            <input type="month" id="monthSelector">

            <div class="balance-card">
                <p>Available Balance</p>
                <h2 id="currentBalance">₹0</h2>
            </div>

            <div class="card">
                <h3>Budget Breakdown</h3>
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>Monthly Budget</h3>
                <input type="number" id="incomeInput" placeholder="Enter Total Income (₹)">
                <button onclick="setIncome()">Update Income</button>
            </div>

            <div class="card">
                <h3>New Transaction</h3>
                <input type="text" id="expenseName" placeholder="Description (e.g., Groceries)">
                <input type="number" id="expenseAmount" placeholder="Amount (₹)">
                
                <input type="text" id="expenseCategory" list="categoryOptions" placeholder="Category (Select or Type Custom)">
                <datalist id="categoryOptions">
                    </datalist>

                <button id="addBtn" onclick="addExpense()">Add Transaction</button>
            </div>

            <div class="card">
                <h3>Recent Transactions</h3>
                <div id="expenseList"></div>
            </div>
        </div>

        <div id="tabHistory" class="hidden">
            <h1>Past Statements</h1>
            <div class="subtitle">Your previous monthly records</div>

            <div class="card">
                <h3>Export & Share</h3>
                <p class="subtitle" style="margin-bottom: 10px;">Select months for a consolidated report:</p>
                
                <div id="exportMonthCheckboxes" class="checkbox-container">
                    </div>
                
                <div class="flex-row">
                    <button onclick="downloadCSV()" class="btn-green">Download CSV</button>
                    <button onclick="shareSummary()">Share via App</button>
                </div>
            </div>

            <div id="statementsList"></div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
