<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tracker">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Overview</h1>
        <div class="subtitle">Track your spending</div>
        
        <input type="month" id="monthSelector">

        <div class="card">
            <h3>Budget Breakdown</h3>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>Monthly Budget</h3>
            <input type="number" id="incomeInput" placeholder="Enter Total Income ($)">
            <button onclick="setIncome()">Update Income</button>
        </div>

        <div class="card">
            <h3>New Transaction</h3>
            <input type="text" id="expenseName" placeholder="What did you buy?">
            <input type="number" id="expenseAmount" placeholder="Amount ($)">
            <select id="expenseCategory">
                <option value="Food">🍔 Food & Dining</option>
                <option value="Transport">🚗 Transportation</option>
                <option value="Utilities">💡 Utilities & Bills</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Other">✨ Other</option>
            </select>
            <button onclick="addExpense()">Add Transaction</button>
        </div>

        <div class="card">
            <h3>Recent Transactions</h3>
            <div id="expenseList">
                </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
